<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
  </head>
  <body>

    <main>
      <button id="button_theme">Theme</button>
      <div id="task-manager">
        <h1>My Task Manager</h1>
        <form id="task-form">
          <input type="text" placeholder="Enter a new task" id="task-input"
            required>
          <button type="submit">Add Task</button>
        </form>
        <ul id="task-list">
          <li>Task content
            <span class="delete-btn">✖️</span>
            <span class="edit-btm">✍️</span>
          </li>
        </ul>
      </div>
    </main>
    <script src="taskManager.js">

</script>
  </body>
</html>

  <body>
    <div>
      <button id="button_theme">Theme 🌞</button>
    </div>

    <main class="main">
      <div id="task-manager">
        <h1>My Task Manager</h1>
        <form id="task-form">
          <input type="text" placeholder="Enter a new task" id="task-input"
            required name="input" autocomplete="off">
          <button type="submit">Add Task</button>
        </form>
        <ul id="task-list"> </ul>
      </div>
    </main>
    <script src="taskManager.js">

</script>
  </body>
